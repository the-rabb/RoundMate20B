<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e2547; --muted:#6b7a99; --line:#e6ebf5;
  --primary:#4f46e5; --primary-soft:#eef2ff; --green:#10b981;
  --shadow:0 12px 32px -16px rgba(30,41,90,.22);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;color:var(--ink);background:#f5f7fc;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 0% 0%,#e0e7ff 0%,transparent 70%),
  radial-gradient(50% 45% at 100% 5%,#dbeafe 0%,transparent 70%),
  radial-gradient(55% 50% at 50% 110%,#fae8ff 0%,transparent 70%),#f5f7fc}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex-shrink:0}
h1,h2,h3{font-family:"Prompt","IBM Plex Sans Thai",sans-serif}
.wrap{width:min(900px,100%);margin:0 auto;padding:20px 16px 130px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:26px 26px 22px;border-radius:30px;color:var(--ink);
  background:linear-gradient(135deg,#e0e7ff 0%,#ede9fe 45%,#dbeafe 100%);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 40px -26px rgba(99,102,241,.55)}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-90px;top:-140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75),transparent 65%)}
.hero::after{content:"";position:absolute;width:260px;height:260px;left:-80px;bottom:-160px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,207,232,.55),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.kicker{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.7);
  color:#4f46e5;font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
.kicker svg{width:14px;height:14px}
.hero h1{margin:0;font-size:clamp(22px,4.2vw,30px);font-weight:600;line-height:1.3;color:#1e1b4b}
.ward{margin-top:4px;color:#5b6b8f;font-size:15px}
.ring{position:relative;flex:0 0 96px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.55)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring-bg{stroke:rgba(99,102,241,.15)}
.ring-fg{stroke:#10b981;transition:stroke-dashoffset .5s ease}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-text b{font-family:Prompt;font-size:24px;font-weight:600;color:#1e1b4b}
.ring-text span{font-size:11px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.75);border:1px solid #fff;color:#312e81;font-weight:600;font-size:14px}
.pill svg{width:16px;height:16px;color:#6366f1}
.pill select{appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;font-weight:600;
  padding-right:20px;max-width:180px;cursor:pointer;color:#312e81}
.pill .chev{position:absolute;right:13px;pointer-events:none;font-size:11px;color:#6366f1}
.pill.need{background:#fef3c7;border-color:#fcd34d;color:#78350f;animation:pulse 1.8s infinite}
.pill.need select{color:#78350f}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}50%{box-shadow:0 0 0 8px rgba(251,191,36,0)}}

/* ---------- Team Switcher Tabs (สั้นกระชับ) ---------- */
.team-switch{display:flex;gap:8px;margin-top:16px;padding:4px;background:rgba(255,255,255,.6);border-radius:16px;border:1px solid #fff}
.team-tab{flex:1;min-height:38px;border:0;border-radius:12px;background:transparent;font-family:Prompt;font-weight:600;font-size:14px;color:#4338ca;transition:.2s}
.team-tab.active{background:#4f46e5;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}

.letters{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.letter{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.55);
  border:1.5px solid rgba(255,255,255,.9);font-family:Prompt;font-weight:600;color:#a5b4fc;transition:.25s}
.letter.on{background:var(--b);color:var(--c);border-color:var(--c);transform:translateY(-2px);box-shadow:0 6px 14px -8px var(--c)}

/* ---------- Settings Gear Button ---------- */
.admin-gear{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.4);color:#4338ca;display:grid;place-items:center;cursor:pointer;transition:.2s}
.admin-gear:hover{background:#fff;transform:scale(1.08)}
.admin-gear svg{width:20px;height:20px}

/* ---------- Cards ---------- */
.card{margin-top:16px;padding:20px;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid #fff;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{display:flex;align-items:center;gap:8px;margin:0;font-size:17px;font-weight:600}
.card-head h2 svg{width:20px;height:20px;color:var(--primary)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

.dept-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dept{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;border-radius:18px;
  border:1.5px solid var(--line);background:#fff;text-align:left;transition:.2s}
.dept:hover{border-color:#c7d2fe;transform:translateY(-1px)}
.dept-name{font-family:Prompt;font-weight:600;font-size:16px}
.dept-meta{font-size:12px;color:var(--muted)}
.mini{width:100%;height:5px;margin-top:6px;border-radius:9px;background:#eef2f7;overflow:hidden}
.mini i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#34d399,#10b981)}
.dept.active{border-color:transparent;color:#fff;background:linear-gradient(135deg,#6366f1,#60a5fa);box-shadow:0 12px 24px -14px rgba(79,70,229,.8)}
.dept.active .dept-meta{color:#eef2ff}
.dept.active .mini{background:rgba(255,255,255,.3)}
.dept.active .mini i{background:#fff}

.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:16px}
.bed{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/1;border-radius:18px;
  border:1.5px solid var(--line);background:#fff;font-family:Prompt;font-size:22px;font-weight:600;color:#334155;transition:.2s}
.bed small{font-family:"IBM Plex Sans Thai";font-size:10.5px;font-weight:500;color:var(--muted)}
.bed.partial{background:#fffbeb;border-color:#fde68a;color:#b45309}
.bed.partial small{color:#b45309}
.bed.done{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.bed.done small{color:#059669}
.bed.na{background:#f1f5f9;border-style:dashed;border-color:#cbd5e1;color:#64748b}
.bed.current{outline:3px solid #a5b4fc;outline-offset:3px;transform:scale(1.04)}

.na-box{margin-top:18px;padding:14px 16px;border-radius:18px;background:#f8fafc;border:1px solid var(--line);transition:.2s}
.na-box.on{background:#f5f3ff;border-color:#ddd6fe}
.na-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.na-row b{display:block;font-weight:600}
.na-row span{font-size:12.5px;color:var(--muted)}
.switch{position:relative;flex:0 0 52px;width:52px;height:30px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.slider{position:absolute;inset:0;border-radius:99px;background:#cbd5e1;transition:.2s}
.slider::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+.slider{background:#8b5cf6}
.switch input:checked+.slider::after{transform:translateX(22px)}
.reasons{margin-top:14px;padding-top:14px;border-top:1px dashed #ddd6fe}
.warn-text{margin:10px 0 0;font-size:12.5px;color:#b45309}

/* ---------- ตัวเลือกพาสเทล ---------- */
.sub-label{margin-bottom:8px;font-size:12px;font-weight:600;letter-spacing:.03em;color:#64748b}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{--ob:#fff;--oo:#e6ebf5;--oi:#334155;--od:#a5b4fc;
  display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:999px;
  border:1.5px solid var(--oo);background:var(--ob);color:var(--oi);font-size:13.5px;font-weight:600;transition:.15s}
.opt:hover{border-color:var(--od)}
.opt.on{background:var(--oo);border-color:var(--od);font-weight:700;transform:translateY(-1px);
  box-shadow:0 6px 14px -8px var(--od)}
.ck{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#fff;color:var(--oi);font-size:11px;font-weight:800}

.section-label{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 4px;
  font-family:Prompt;font-weight:600;font-size:15px;color:#334155}
.count-badge{font-family:"IBM Plex Sans Thai";font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600}

.item{margin-top:12px;border-radius:22px;background:#fff;border:1.5px solid var(--line);box-shadow:0 6px 18px -14px rgba(30,41,90,.35);overflow:hidden;transition:.2s}
.item.on{border-color:#a7f3d0;box-shadow:0 10px 24px -16px rgba(16,185,129,.6)}
.item-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;-webkit-user-select:none}
.badge{flex:0 0 48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--bg);color:var(--c);
  font-family:Prompt;font-size:22px;font-weight:700}
.item-text{flex:1;min-width:0}
.item-title{font-family:Prompt;font-weight:600;font-size:16px}
.item-desc{margin-top:3px;font-size:13px;line-height:1.55;color:var(--muted)}
.tick{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:50%;border:2px solid #d6dde9;color:transparent;transition:.2s}
.tick svg{width:16px;height:16px}
.item.on .tick{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.05)}
.item-body{padding:2px 18px 16px 80px}
.sub+.sub{margin-top:12px}
.hint{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.hint b{display:block;margin-bottom:4px}
.hint ul{margin:0;padding-left:18px}
.hint.ett{background:#fffbeb;color:#78350f}
.hint.trac{background:#f7fee7;color:#3f6212}
.hint.icd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#eef2ff;color:#3730a3}
.hint.icd b{margin:0}
.icd-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:0;background:#fff;
  color:#4338ca;font-weight:700;text-decoration:none;box-shadow:0 4px 12px -6px rgba(67,56,202,.5)}
.icd-link svg{width:15px;height:15px}

/* ---------- ประเมินความเสี่ยง ---------- */
.risk-grid{display:grid;gap:12px;margin-top:12px;grid-template-columns:1fr}
.risk{padding:14px 15px;border-radius:22px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column}
.risk-title{font-family:Prompt;font-weight:600;font-size:15px}
.risk p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.tiles{display:grid;gap:8px;margin-top:10px;grid-template-columns:repeat(var(--n),1fr)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 4px;
  border-radius:14px;border:1.5px solid transparent;background:#f8fafc;font-size:12.5px;font-weight:600;color:#475569;transition:.15s}
.tile .emo{font-size:22px;line-height:1.1;filter:grayscale(.35);opacity:.8;transition:.15s}
.tile:hover{background:#f1f5f9}
.tile.on .emo{filter:none;opacity:1;transform:scale(1.12)}
.tile.on.good{background:#d1fae5;border-color:#34d399;color:#047857}
.tile.on.warn{background:#fef3c7;border-color:#fbbf24;color:#b45309}
.tile.on.bad{background:#fee2e2;border-color:#f87171;color:#b91c1c}
.tile:disabled{cursor:not-allowed;opacity:.45}
.tile.on:disabled{opacity:1}
.auto-note{margin-top:8px!important;color:#b91c1c!important;font-weight:500}
@media (min-width:760px){
  .risk-grid{grid-template-columns:1.25fr 1fr 1fr}
  .risk.conscious .tiles{--n:2!important}
}

.notes{margin-top:12px;padding:16px 18px;border-radius:22px;background:#fff;border:1.5px solid var(--line)}
.notes label{display:block;font-family:Prompt;font-weight:600;margin-bottom:8px}
.notes label span{font-family:"IBM Plex Sans Thai";font-weight:400;font-size:12.5px;color:var(--muted)}
textarea{width:100%;min-height:90px;resize:vertical;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#f8fafc;outline:0;transition:.15s}
textarea:focus{border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 4px #eef2ff}

.state-card{margin-top:16px;padding:34px 22px;text-align:center;border-radius:26px;background:rgba(255,255,255,.85);border:1.5px dashed #c7d2fe}
.state-icon{width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:var(--primary)}
.state-icon svg{width:30px;height:30px}
.state-card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.state-card p{margin:0;color:var(--muted)}
.start{margin-top:16px;border:0;padding:12px 22px;border-radius:999px;color:#fff;font-weight:600;
  background:linear-gradient(135deg,#6366f1,#3b82f6);box-shadow:0 12px 24px -12px rgba(79,70,229,.8)}
.state-card.na{border-color:#ddd6fe;background:#faf5ff}
.state-card.na .state-icon{background:#ede9fe;color:#7c3aed}

/* ---------- แถบเมนูล่าง ---------- */
.dock{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(860px,calc(100% - 24px));display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;
  background:rgba(255,255,255,.88);border:1px solid #e0e7ff;color:var(--ink);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 36px -18px rgba(30,41,90,.4)}
.dock-btn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:10px 18px;border:0;border-radius:999px;
  background:#eef2ff;color:#4338ca;font-weight:600;white-space:nowrap;transition:.15s}
.dock-btn svg{width:18px;height:18px}
.dock-btn:disabled{opacity:.4;cursor:not-allowed}
.dock-btn.next{color:#fff;background:linear-gradient(135deg,#6366f1,#3b82f6)}
.dock-btn.finish{color:#fff;background:linear-gradient(135deg,#10b981,#059669)}
.dock-mid{flex:1;min-width:0;text-align:center;line-height:1.25}
.dock-mid b{display:block;font-family:Prompt;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-mid span{font-size:11px;color:var(--muted)}

.toast{position:fixed;z-index:60;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;padding:12px 18px;border-radius:14px;
  background:#1e2547;color:#fff;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(15,23,42,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.sheet{width:min(780px,100%);max-height:92vh;overflow:auto;padding:32px;border-radius:32px;background:#fff;
  box-shadow:0 30px 80px -20px rgba(30,41,90,.35);animation:pop .25s ease}
.sheet.small{width:min(480px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{margin:0;font-size:22px;font-weight:700;color:#1e1b4b}
.sheet-sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.sheet-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn{min-height:46px;padding:10px 24px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#6366f1,#3b82f6);box-shadow:0 10px 20px -10px rgba(79,70,229,.6)}
.btn.success{border:0;color:#fff;background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 10px 20px -10px rgba(16,185,129,.6)}
.btn:disabled{opacity:.6;cursor:wait}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:14px;border-radius:18px;background:#f8fafc;text-align:center}
.stat b{display:block;font-family:Prompt;font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.missing{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

.sum-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.sum-badge-icon{flex:0 0 56px;height:56px;display:grid;place-items:center;border-radius:18px;color:#4f46e5;background:linear-gradient(135deg,#e0e7ff,#ede9fe)}
.sum-badge-icon svg{width:28px;height:28px}
.saved-banner{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:14px 18px;border-radius:18px;
  background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;color:#047857;font-weight:600;font-size:14.5px;box-shadow:0 4px 12px -6px rgba(16,185,129,.2)}
.saved-banner svg{width:20px;height:20px;flex-shrink:0}

.eq-container{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
.eq-box{position:relative;overflow:hidden;padding:22px 18px;border-radius:26px;border:1px solid rgba(0,0,0,.04);box-shadow:0 10px 30px -12px rgba(0,0,0,.08)}
.eq-box.fc{background:linear-gradient(145deg,#fff1f2,#ffe4e6);color:#9f1239}
.eq-box.cl{background:linear-gradient(145deg,#f0f9ff,#e0f2fe);color:#0369a1}
.eq-box.ett{background:linear-gradient(145deg,#fffbeb,#fef3c7);color:#92400e}
.eq-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.eq-title{font-family:Prompt;font-size:16px;font-weight:700;letter-spacing:.02em}
.eq-num{font-family:Prompt;font-size:32px;font-weight:700;line-height:1}
.eq-num small{font-size:12px;font-family:"IBM Plex Sans Thai";font-weight:500;margin-left:2px;opacity:.8}
.eq-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;max-height:150px;overflow-y:auto}
.eq-tag{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.9);font-family:Prompt;font-weight:600;font-size:13.5px;
  box-shadow:0 2px 6px rgba(0,0,0,.04)}
.eq-none{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.5);text-align:center;font-size:13px;opacity:.7;font-weight:500}

/* Settings Modal Options */
.admin-group{margin-bottom:16px}
.admin-group label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.admin-select{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.checkbox-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;padding:12px;background:#f8fafc;border-radius:14px;border:1px solid var(--line)}
.checkbox-grid label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;cursor:pointer}
.checkbox-grid input{width:18px;height:18px;accent-color:var(--primary)}

@media (max-width:640px){
  .wrap{padding:12px 12px 120px}
  .hero{padding:22px 20px 20px;border-radius:26px}
  .ring{flex-basis:80px;width:80px;height:80px}
  .ring-text b{font-size:20px}
  .letter{width:30px;height:30px;border-radius:9px;font-size:14px}
  .card{padding:16px;border-radius:22px}
  .item-head{padding:14px;gap:12px}
  .badge{flex-basis:42px;height:42px;font-size:19px;border-radius:13px}
  .item-body{padding:0 14px 14px}
  .eq-container,.stat-row{grid-template-columns:1fr}
  .dock-btn{padding:10px 14px}
  .dock-btn .lbl{display:none}
  .legend{display:none}
  .sheet{padding:20px;border-radius:26px}
}
</style>
</head>
<body>
<main class="wrap" id="app">กำลังโหลดข้อมูล…</main>
<nav class="dock" id="dock" hidden></nav>
<div class="overlay" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const ICD_CHECKLIST_URL = "https://roundmate20b.softr.app/checklisticd";
const WARD = "หอผู้ป่วยสามัญศัลยกรรมอุบัติเหตุชาย 20B";

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  clock: svg('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  bed: svg('<path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  left: svg('<path d="m15 18-6-6 6-6"/>'),
  right: svg('<path d="m9 18 6-6-6-6"/>'),
  flag: svg('<path d="M4 22V4a1 1 0 0 1 1-1h13l-3 5 3 5H5"/>'),
  ext: svg('<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
  clip: svg('<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>'),
  shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
};

const CHECKS = [
  { id:"iIdentify", letter:"I", title:"Identify", desc:"การระบุตัวผู้ป่วย : ป้ายข้อมือผู้ป่วย", c:"#e11d48", bg:"#ffe4e6" },
  { id:"iInfection", letter:"I", title:"Infection", desc:"ล้างมือก่อน-หลังสัมผัสผู้ป่วย, ความสะอาดของผู้ป่วยและสิ่งแวดล้อม, ประเมินบาดแผล/การอักเสบ", c:"#ea580c", bg:"#ffedd5" },
  { id:"sSiderail", letter:"S", title:"Siderail", desc:"ยกไม้กั้นเตียง เพื่อป้องกัน Fall", c:"#d97706", bg:"#fef3c7" },
  { id:"iIvFluid", letter:"I", title:"IV Fluid", desc:"IV, ยาที่ drip อยู่ ถูกคน ถูกชนิด, ตรวจสอบ exp เข็ม, phlebitis", c:"#ca8a04", bg:"#fef9c3" },
  { id:"tTube", letter:"T", title:"Tube / Traction / Drain", desc:"ET-Tube อยู่ในตำแหน่ง, Traction อยู่ในแนวและถ่วงน้ำหนักตามแผนการรักษา, F/C อยู่ในตำแหน่ง สายไม่หักพับงอ, Drain ต่างๆ work ดี", c:"#65a30d", bg:"#ecfccb" },
  { id:"dDown", letter:"D", title:"Down", desc:"ปรับเตียงต่ำสุด, F/C ไม่สัมผัสพื้น", c:"#059669", bg:"#d1fae5" },
  { id:"oOxygen", letter:"O", title:"Oxygen", desc:"ผู้ป่วยหายใจดี ไม่เหนื่อย/หายใจเร็ว, ปริมาณ O₂ และตำแหน่งถูกต้อง", c:"#0891b2", bg:"#cffafe" },
  { id:"wWaste", letter:"W", title:"Waste", desc:"ไม่มีสารคัดหลั่ง/ปัสสาวะเลอะเทอะ", c:"#2563eb", bg:"#dbeafe" },
  { id:"nNeeds", letter:"N", title:"Needs", desc:"สอบถามความต้องการผู้ป่วย", c:"#7c3aed", bg:"#ede9fe" },
];

const OPTIONS = {
  needleExpDays: ["จ","อ","พ","พฤ","ศ","ส","อา","C-line","N/A"],
  oxygenType: ["ETT/TT","High Flow","Cannula","MCB","RA"],
  consciousness: ["ตื่นดี","สับสน","ซึม","ไม่รู้สึกตัว"],
  fallRisk: ["ต่ำ","สูง"],
  bleedingRisk: ["ไม่เสี่ยง","เสี่ยง"],
};

const PALETTES = [
  ["#fffbeb","#fde68a","#92400e","#fbbf24"],
  ["#f0fdf4","#bbf7d0","#166534","#4ade80"],
  ["#eff6ff","#bfdbfe","#1e40af","#60a5fa"],
  ["#faf5ff","#e9d5ff","#6b21a8","#c084fc"],
  ["#fdf2f8","#fbcfe8","#9d174d","#f472b6"],
  ["#fff7ed","#fed7aa","#9a3412","#fb923c"],
  ["#f0f9ff","#bae6fd","#075985","#38bdf8"],
  ["#f5f3ff","#ddd6fe","#5b21b6","#a78bfa"],
  ["#f7fee7","#d9f99d","#3f6212","#a3e635"],
  ["#f0fdfa","#99f6e4","#115e59","#2dd4bf"],
];

function getPalette(name) {
  if (name === "C-line") return ["#f0f9ff","#bae6fd","#075985","#38bdf8"];
  if (name === "N/A") return ["#f8fafc","#e2e8f0","#334155","#94a3b8"];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return PALETTES[Math.abs(hash) % PALETTES.length];
}

const TONE = {
  consciousness: { "ตื่นดี":"good", "สับสน":"warn", "ซึม":"warn", "ไม่รู้สึกตัว":"bad" },
  fallRisk: { "ต่ำ":"good", "สูง":"bad" },
  bleedingRisk: { "ไม่เสี่ยง":"good", "เสี่ยง":"bad" },
};
const EMOJI = {
  consciousness: { "ตื่นดี":"😊", "สับสน":"😕", "ซึม":"😪", "ไม่รู้สึกตัว":"😵" },
  fallRisk: { "ต่ำ":"🚶", "สูง":"🤕" },
  bleedingRisk: { "ไม่เสี่ยง":"🛡️", "เสี่ยง":"🩸" },
};
const LABEL = { fallRisk: { "ต่ำ":"เสี่ยงต่ำ", "สูง":"เสี่ยงสูง" } };
const STATUS_LABEL = { todo:"ยังไม่ทำ", partial:"กำลังทำ", done:"ครบ", na:"N/A" };
const AUTO_HIGH = ["สับสน","ซึม","ไม่รู้สึกตัว"];

let config, shiftInfo, departments = [], rawDepartments = [];
let currentDept = "", currentBed = "", nurse = "";
let adminMode = "single";
let activeTeam = "team1";

let allDeptsList = ["แผนก 1", "แผนก 2", "แผนก 3", "แผนก 4", "ห้องแยก"];
let singleTeamDepts = ["แผนก 1", "แผนก 2", "แผนก 3", "แผนก 4", "ห้องแยก"];
let team1Depts = ["แผนก 1", "แผนก 2"];
let team2Depts = ["แผนก 3", "แผนก 4", "ห้องแยก"];

let state = freshState(), draft = { beds:{} }, saving = false;

function freshState() {
  return { checks:{}, consciousness:"", fallRisk:"", bleedingRisk:"", notes:"",
           needleExpDays:[], tubeTypes:[], oxygenType:"", bedEmpty:false, emptyReason:"" };
}
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
const draftKey = () => "isitdown_draft_" + shiftInfo.date + "_" + shiftInfo.shift + "_" + adminMode + "_" + (adminMode === "dual" ? activeTeam : "all");
const bedKey = (d, b) => d + "|" + b;

function loadDraft() {
  try { draft = JSON.parse(localStorage.getItem(draftKey())) || { beds:{} }; } catch { draft = { beds:{} }; }
  draft.beds ||= {};
}
function persist() {
  if (!currentDept || !currentBed) return;
  draft.beds[bedKey(currentDept, currentBed)] = JSON.parse(JSON.stringify(state));
  draft.dept = currentDept; draft.bed = currentBed;
  try { localStorage.setItem(draftKey(), JSON.stringify(draft)); } catch {}
}
function loadBed(d, b) {
  currentDept = d; currentBed = b;
  state = JSON.parse(JSON.stringify(draft.beds[bedKey(d, b)] || freshState()));
  render();
}

function updateDepartmentsFilter() {
  if (adminMode === "dual") {
    const targetDepts = activeTeam === "team1" ? team1Depts : team2Depts;
    departments = rawDepartments.filter(d => targetDepts.includes(d.name));
  } else {
    departments = rawDepartments.filter(d => singleTeamDepts.includes(d.name));
  }
}

function completeForBed(s) {
  if (!s) return false;
  if (s.bedEmpty) return !!s.emptyReason;
  return CHECKS.every(i => !!(s.checks || {})[i.id]) && !!s.consciousness && !!s.fallRisk && !!s.bleedingRisk;
}
function touched(s) {
  if (!s) return false;
  return s.bedEmpty || Object.values(s.checks || {}).some(Boolean) || !!(s.consciousness || s.fallRisk ||
    s.bleedingRisk || s.notes || s.oxygenType) || (s.needleExpDays || []).length > 0 || (s.tubeTypes || []).length > 0;
}
function bedState(d, b) { return (d === currentDept && b === currentBed) ? state : draft.beds[bedKey(d, b)]; }
function bedStatus(d, b) {
  const s = bedState(d, b);
  if (completeForBed(s)) return s.bedEmpty ? "na" : "done";
  return touched(s) ? "partial" : "todo";
}
const isFinished = st => st === "done" || st === "na";
function deptProgress(dept) { return dept.beds.filter(b => isFinished(bedStatus(dept.name, b))).length; }
function completionCount() {
  let done = 0, total = 0;
  departments.forEach(d => d.beds.forEach(b => { total++; if (isFinished(bedStatus(d.name, b))) done++; }));
  return { done, total };
}
function answeredCount() {
  return CHECKS.filter(i => state.checks[i.id]).length +
    [state.consciousness, state.fallRisk, state.bleedingRisk].filter(Boolean).length;
}

function openIcd() {
  if (!ICD_CHECKLIST_URL) return toast("ยังไม่ได้ตั้งค่าลิงก์ Checklist ICD Care");
  window.open(ICD_CHECKLIST_URL, "_blank", "noopener");
}
function toggleCheck(id) { state.checks[id] = !state.checks[id]; persist(); render(); }
function toggleMulti(field, value) {
  const old = state[field] || [];
  if (value === "N/A") state[field] = old.includes("N/A") ? [] : ["N/A"];
  else if (field === "needleExpDays" && value === "C-line") state[field] = old.includes("C-line") ? [] : ["C-line"];
  else {
    const list = old.filter(x => x !== "N/A" && !(field === "needleExpDays" && x === "C-line"));
    state[field] = list.includes(value) ? list.filter(x => x !== value) : [...list, value];
  }
  if (field === "needleExpDays") state.checks.iIvFluid = state[field].length > 0;
  if (field === "tubeTypes") state.checks.tTube = state[field].length > 0;
  persist();
  if (field === "tubeTypes" && value === "ICD" && state.tubeTypes.includes("ICD")) openIcd();
  render();
}
function setOxygen(value) {
  state.oxygenType = state.oxygenType === value ? "" : value;
  state.checks.oOxygen = !!state.oxygenType;
  persist(); render();
}
function toggleSingle(field, value) {
  state[field] = state[field] === value ? "" : value;
  if (field === "consciousness" && AUTO_HIGH.includes(state[field])) state.fallRisk = "สูง";
  persist(); render();
}
function setEmpty(on) {
  if (on) { const keepNotes = state.notes; state = freshState(); state.notes = keepNotes; }
  state.bedEmpty = on;
  if (!on) state.emptyReason = "";
  persist(); render();
}
function moveBed(dir) {
  persist();
  const di = departments.findIndex(d => d.name === currentDept);
  const beds = departments[di].beds, bi = beds.indexOf(currentBed) + dir;
  if (bi >= 0 && bi < beds.length) loadBed(currentDept, beds[bi]);
  else {
    const nd = departments[di + dir];
    if (!nd) return;
    loadBed(nd.name, dir > 0 ? nd.beds[0] : nd.beds[nd.beds.length - 1]);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
const isFirstBed = () => departments.length && currentDept === departments[0].name && currentBed === departments[0].beds[0];
function isLastBed() {
  if (!departments.length) return false;
  const l = departments[departments.length - 1];
  return currentDept === l.name && currentBed === l.beds[l.beds.length - 1];
}

function opt(v, on, action, field) {
  const p = getPalette(v);
  return `<button type="button" class="opt ${on ? "on" : ""}" style="--ob:${p[0]};--oo:${p[1]};--oi:${p[2]};--od:${p[3]}"
    data-action="${action}" ${field ? `data-field="${field}"` : ""} data-value="${esc(v)}">
    ${on ? `<span class="ck">✓</span>` : ""}${esc(v)}</button>`;
}
function sub(label, field, items) {
  return `<div class="sub"><div class="sub-label">${label}</div><div class="chips">
    ${items.map(v => opt(v, state[field].includes(v), "multi", field)).join("")}</div></div>`;
}
function itemCard(item) {
  const on = !!state.checks[item.id];
  let body = "";
  if (item.id === "iIvFluid") body = sub("วัน exp เข็ม", "needleExpDays", OPTIONS.needleExpDays);
  if (item.id === "tTube") {
    body = sub("ประเภท Tube / Drain", "tubeTypes", config.drainTypes);
    if (state.tubeTypes.includes("ICD")) body += `<div class="hint icd"><b>ผู้ป่วยมี ICD — ทำ Checklist ICD Care</b>
      ${ICD_CHECKLIST_URL
        ? `<a class="icd-link" href="${esc(ICD_CHECKLIST_URL)}" target="_blank" rel="noopener">เปิด Checklist ${ICON.ext}</a>`
        : `<button type="button" class="icd-link" data-action="icd">เปิด Checklist ${ICON.ext}</button>`}</div>`;
    if (state.tubeTypes.includes("ETT/TT")) body += `<div class="hint ett"><b>ETT/TT Safety Scan</b><ul>
      <li>ตรวจสอบตำแหน่ง (ความลึก) ของท่อช่วยหายใจ</li><li>ตรวจสอบ cuff pressure</li>
      <li>ไม่มี secretion อุดตัน</li><li>ระบบเครื่องช่วยหายใจ: สายไม่หักพับงอ ไม่มีน้ำค้างใน circuit</li></ul></div>`;
    if (state.tubeTypes.includes("Traction")) body += `<div class="hint trac"><b>Traction Quick Alert</b><ul>
      <li>Alignment &amp; traction ถูกต้อง</li><li>รอก/เชือก ทำงานได้อิสระ ไม่ติดขัด</li>
      <li>น้ำหนัก traction ตามแผนการรักษา</li><li>Neurovascular: Circulation · Sensation · Movement · Pain</li>
      <li>Pin site: สังเกตบวม แดง เลือดออก หรือมี discharge ซึม</li></ul></div>`;
  }
  if (item.id === "oOxygen") body = `<div class="sub"><div class="sub-label">วิธีให้ออกซิเจน</div><div class="chips">
    ${OPTIONS.oxygenType.map(v => opt(v, state.oxygenType === v, "oxygen")).join("")}</div></div>`;
  return `<article class="item ${on ? "on" : ""}" style="--c:${item.c};--bg:${item.bg}">
    <div class="item-head" data-action="check" data-id="${item.id}" role="button" aria-pressed="${on}">
      <span class="badge">${item.letter}</span>
      <div class="item-text"><div class="item-title">${esc(item.title)}</div><div class="item-desc">${esc(item.desc)}</div></div>
      <span class="tick">${ICON.check}</span>
    </div>${body ? `<div class="item-body">${body}</div>` : ""}</article>`;
}
function riskCard(title, desc, field, cls = "") {
  const locked = field === "fallRisk" && AUTO_HIGH.includes(state.consciousness);
  const vals = OPTIONS[field];
  return `<section class="risk ${cls}"><div class="risk-title">${title}</div>${desc ? `<p>${desc}</p>` : ""}
    <div class="tiles" style="--n:${vals.length}">${vals.map(v => `
      <button type="button" class="tile ${state[field] === v ? "on " + TONE[field][v] : ""}"
        data-action="single" data-field="${field}" data-value="${esc(v)}" ${locked ? "disabled" : ""}>
        <span class="emo">${EMOJI[field][v]}</span>${esc((LABEL[field] || {})[v] || v)}</button>`).join("")}</div>
    ${locked ? `<p class="auto-note">ปรับเป็นเสี่ยงสูงอัตโนมัติ</p>` : ""}</section>`;
}
function renderForm() {
  return `
    <div class="section-label"><span>เช็กลิสต์ I‑SITDOWN</span><span class="count-badge">ตอบแล้ว ${answeredCount()}/12</span></div>
    ${CHECKS.map(itemCard).join("")}
    <div class="section-label"><span>ประเมินความเสี่ยง</span></div>
    <div class="risk-grid">
      ${riskCard("ระดับความรู้สึกตัว", "", "consciousness", "conscious")}
      ${riskCard("Risk for Fall", "ความเสี่ยงพลัดตกหกล้ม", "fallRisk")}
      ${riskCard("Risk for Bleeding", "Plt ต่ำ, Hct drop, ยาละลายลิ่มเลือด", "bleedingRisk")}
    </div>
    <div class="notes"><label for="notes">หมายเหตุ <span>(ถ้ามี)</span></label>
      <textarea id="notes" placeholder="บันทึกหมายเหตุเพิ่มเติม...">${esc(state.notes)}</textarea></div>`;
}
function naBox() {
  return `<div class="na-box ${state.bedEmpty ? "on" : ""}">
    <div class="na-row">
      <div><b>เตียงนี้ไม่มีผู้ป่วยให้ประเมิน (N/A)</b><span>เปิดเมื่อเตียงว่าง หรือผู้ป่วยไม่อยู่ที่เตียง</span></div>
      <label class="switch"><input type="checkbox" id="bedEmpty" ${state.bedEmpty ? "checked" : ""} aria-label="N/A"><span class="slider"></span></label>
    </div>
    ${state.bedEmpty ? `<div class="reasons"><div class="sub-label">เลือกเหตุผล</div><div class="chips">
      ${config.emptyReasons.map(r => opt(r, state.emptyReason === r, "reason")).join("")}</div>
      ${state.emptyReason ? "" : `<p class="warn-text">ต้องเลือกเหตุผลก่อน จึงจะนับว่าเตียงนี้เสร็จ</p>`}</div>` : ""}
  </div>`;
}
function render() {
  const prog = completionCount(), C = 188.5, pct = prog.total ? prog.done / prog.total : 0;
  const dept = departments.find(d => d.name === currentDept);
  const teamLabel = adminMode === "dual" ? (activeTeam === "team1" ? "ทีม 1" : "ทีม 2") : "";

  let main;
  if (!currentBed) main = `<div class="state-card"><div class="state-icon">${ICON.clip}</div>
      <h3>พร้อมเริ่มราวน์เวร${esc(shiftInfo.shift)}${teamLabel ? ' ('+teamLabel+')' : ''}</h3><p>เลือกแผนกด้านบน เพื่อเริ่มประเมินเตียงแรก</p>
      <button class="start" data-action="dept" data-value="${esc(departments[0]?.name || '')}">เริ่มที่ ${esc(departments[0]?.name || '')}</button></div>`;
  else if (!nurse) main = `<div class="state-card"><div class="state-icon">${ICON.user}</div>
      <h3>เลือกชื่อผู้ประเมินก่อน</h3><p>แตะช่องสีเหลืองด้านบนเพื่อเลือกชื่อ</p></div>`;
  else if (state.bedEmpty) main = `<div class="state-card na"><div class="state-icon">${ICON.bed}</div>
      <h3>ข้ามการประเมินเตียงนี้</h3><p>${state.emptyReason ? "เหตุผล: " + esc(state.emptyReason) : "กรุณาเลือกเหตุผลด้านบน"}</p></div>`;
  else main = renderForm();

  document.getElementById("app").innerHTML = `
    <header class="hero">
      <button class="admin-gear" data-action="openAdmin" aria-label="ตั้งค่า">${ICON.gear}</button>
      <div class="hero-top">
        <div>
          <div class="kicker">${ICON.clip} I‑SITDOWN ROUND ${teamLabel ? '('+teamLabel+')' : ''}</div>
          <h1>แบบบันทึกการตรวจเยี่ยมผู้ป่วย</h1>
          <div class="ward">${WARD}</div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" class="ring-bg"/>
            <circle cx="38" cy="38" r="30" class="ring-fg" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - pct)}"/></svg>
          <div class="ring-text"><b>${prog.done}</b><span>/ ${prog.total} เตียง</span></div>
        </div>
      </div>
      <div class="pills">
        <span class="pill">${ICON.cal}${esc(shiftInfo.displayDate)}</span>
        <span class="pill">${ICON.clock}เวร${esc(shiftInfo.shift)}</span>
        <label class="pill ${nurse ? "" : "need"}">${ICON.user}
          <select id="nurse" aria-label="ผู้ประเมิน"><option value="">เลือกผู้ประเมิน</option>
            ${config.staff.map(n => `<option value="${esc(n)}" ${n === nurse ? "selected" : ""}>${esc(n)}</option>`).join("")}
          </select><span class="chev">▼</span></label>
      </div>

      ${adminMode === "dual" ? `
        <div class="team-switch">
          <button type="button" class="team-tab ${activeTeam==='team1'?'active':''}" data-action="switchTeam" data-team="team1">ทีม 1</button>
          <button type="button" class="team-tab ${activeTeam==='team2'?'active':''}" data-action="switchTeam" data-team="team2">ทีม 2</button>
        </div>
      ` : ""}

      <div class="letters">${CHECKS.map(c => `<span class="letter ${currentBed && !state.bedEmpty && state.checks[c.id] ? "on" : ""}" style="--c:${c.c};--b:${c.bg}">${c.letter}</span>`).join("")}</div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>${ICON.bed} เลือกแผนกและเตียง</h2>
        <div class="legend">
          <span><i style="background:#cbd5e1"></i>ยังไม่ทำ</span><span><i style="background:#f59e0b"></i>กำลังทำ</span>
          <span><i style="background:#10b981"></i>ครบ</span><span><i style="background:#94a3b8"></i>N/A</span>
        </div>
      </div>
      <div class="dept-tabs">${departments.map(d => { const n = deptProgress(d); return `
        <button class="dept ${d.name === currentDept ? "active" : ""}" data-action="dept" data-value="${esc(d.name)}">
          <span class="dept-name">${esc(d.name)}</span>
          <span class="dept-meta">${n}/${d.beds.length} เตียง${n === d.beds.length ? " ✓" : ""}</span>
          <span class="mini"><i style="width:${n / d.beds.length * 100}%"></i></span>
        </button>`; }).join("")}</div>
      ${dept ? `<div class="beds">${dept.beds.map(b => { const st = bedStatus(dept.name, b); return `
        <button class="bed ${st} ${b === currentBed ? "current" : ""}" data-action="bed" data-value="${esc(b)}">
          ${esc(b)}<small>${STATUS_LABEL[st]}</small></button>`; }).join("")}</div>` : ""}
      ${dept && currentBed && nurse ? naBox() : ""}
    </section>
    ${main}`;
  renderDock();
}
function renderDock() {
  const dock = document.getElementById("dock");
  if (!currentBed || !nurse) { dock.hidden = true; return; }
  dock.hidden = false;
  const p = completionCount();
  dock.innerHTML = `
    <button class="dock-btn" data-action="prev" ${isFirstBed() || saving ? "disabled" : ""}>${ICON.left}<span class="lbl">ก่อนหน้า</span></button>
    <div class="dock-mid"><b>${esc(currentDept)} · เตียง ${esc(currentBed)}</b><span>บันทึกร่างในเครื่องนี้อัตโนมัติ</span></div>
    ${isLastBed()
      ? `<button class="dock-btn finish" data-action="finish" ${saving ? "disabled" : ""}>${ICON.flag}จบราวน์ ${p.done}/${p.total}</button>`
      : `<button class="dock-btn next" data-action="next">ถัดไป${ICON.right}</button>`}`;
}

function openModal(html, size = "") {
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="sheet ${size}">${html}</div>`;
  m.classList.add("show");
}
function closeModal() { if (!saving) document.getElementById("modal").classList.remove("show"); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800);
}

function openAdminModal() {
  openModal(`
    <h2>ตั้งค่าระบบ</h2>
    <p class="sheet-sub">เลือกรูปแบบการปฏิบัติงานและกำหนดแผนกประจำทีม</p>
    
    <div style="margin-top:18px" class="admin-group">
      <label for="adminModeSelect">รูปแบบการราวน์</label>
      <select id="adminModeSelect" class="admin-select" onchange="toggleAdminView(this.value)">
        <option value="single" ${adminMode==='single'?'selected':''}>ทีมเดียว (รวมแผนกที่เลือก)</option>
        <option value="dual" ${adminMode==='dual'?'selected':''}>2 ทีม (แบ่งแผนก ทีม 1 และ ทีม 2)</option>
      </select>
    </div>

    <div id="singleArea" style="margin-top:16px; ${adminMode==='dual'?'display:none':''}">
      <div class="admin-group">
        <label><b>เลือกแผนกที่ต้องราวน์:</b></label>
        <div class="checkbox-grid">
          ${allDeptsList.map(name => `
            <label><input type="checkbox" name="single_dept" value="${esc(name)}" ${singleTeamDepts.includes(name)?'checked':''}> ${esc(name)}</label>
          `).join("")}
        </div>
      </div>
    </div>

    <div id="dualArea" style="margin-top:16px; ${adminMode==='single'?'display:none':''}">
      <div class="admin-group">
        <label><b>แผนกที่ "ทีม 1" ดูแล:</b></label>
        <div class="checkbox-grid">
          ${allDeptsList.map(name => `
            <label><input type="checkbox" name="t1_dept" value="${esc(name)}" ${team1Depts.includes(name)?'checked':''}> ${esc(name)}</label>
          `).join("")}
        </div>
      </div>

      <div class="admin-group" style="margin-top:12px">
        <label><b>แผนกที่ "ทีม 2" ดูแล (อัตโนมัติจากที่เหลือ):</b></label>
        <div class="checkbox-grid">
          ${allDeptsList.map(name => `
            <label style="${team1Depts.includes(name)?'opacity:0.4':''}"><input type="checkbox" name="t2_dept" value="${esc(name)}" ${team2Depts.includes(name)?'checked':''} disabled> ${esc(name)}</label>
          `).join("")}
        </div>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn" data-action="closeModal">ยกเลิก</button>
      <button class="btn primary" data-action="saveAdmin">บันทึกการตั้งค่า</button>
    </div>
  `);
}

window.toggleAdminView = function(mode) {
  const sArea = document.getElementById("singleArea");
  const dArea = document.getElementById("dualArea");
  if (sArea && dArea) {
    sArea.style.display = (mode === 'single') ? 'block' : 'none';
    dArea.style.display = (mode === 'dual') ? 'block' : 'none';
  }
};

document.addEventListener("change", e => {
  if (e.target.name === "t1_dept") {
    const t1Checked = Array.from(document.querySelectorAll('input[name="t1_dept"]:checked')).map(cb => cb.value);
    document.querySelectorAll('input[name="t2_dept"]').forEach(cb => {
      const isT1 = t1Checked.includes(cb.value);
      cb.checked = !isT1;
      cb.closest("label").style.opacity = isT1 ? "0.4" : "1";
    });
  }
});

function bedLabel(deptName, bed) {
  const num = deptName.replace(/\D/g, "");
  return num ? `${num}-${bed}` : `${deptName} ${bed}`;
}
function equipmentSummary() {
  const r = { "F/C":[], "C-line":[], "ETT/TT":[] };
  departments.forEach(d => d.beds.forEach(b => {
    const s = draft.beds[bedKey(d.name, b)];
    if (!s || s.bedEmpty) return;
    const label = bedLabel(d.name, b);
    if ((s.tubeTypes || []).includes("F/C")) r["F/C"].push(label);
    if ((s.needleExpDays || []).includes("C-line")) r["C-line"].push(label);
    if ((s.tubeTypes || []).includes("ETT/TT") || s.oxygenType === "ETT/TT") r["ETT/TT"].push(label);
  }));
  return r;
}
function requestFinish() {
  if (!nurse) return toast("กรุณาเลือกผู้ประเมินก่อน");
  persist();
  const missing = [];
  departments.forEach(d => d.beds.forEach(b => {
    if (!completeForBed(draft.beds[bedKey(d.name, b)])) missing.push({ d: d.name, b });
  }));
  if (missing.length) {
    return openModal(`<h2>ยังทำไม่ครบ ${missing.length} เตียง</h2>
      <p class="sheet-sub">ประเมินให้ครบ หรือเปิด N/A พร้อมเลือกเหตุผล — แตะเพื่อไปยังเตียงนั้น</p>
      <div class="missing">${missing.map(m => `<button class="opt" data-action="jump" data-dept="${esc(m.d)}" data-bed="${esc(m.b)}">${esc(m.d)} · เตียง ${esc(m.b)}</button>`).join("")}</div>
      <div class="sheet-actions"><button class="btn" data-action="closeModal">ปิด</button></div>`, "small");
  }
  let na = 0, total = 0;
  departments.forEach(d => d.beds.forEach(b => { total++; if (draft.beds[bedKey(d.name, b)].bedEmpty) na++; }));
  
  const teamName = adminMode === 'dual' ? (activeTeam === 'team1' ? ' (ทีม 1)' : ' (ทีม 2)') : '';
  openModal(`<h2>ยืนยันจบราวน์เวร${esc(shiftInfo.shift + teamName)}</h2>
    <p class="sheet-sub">${esc(shiftInfo.displayDate)} · ผู้ประเมิน ${esc(nurse)}</p>
    <div class="stat-row">
      <div class="stat"><b>${total}</b><span>เตียงในความดูแล</span></div>
      <div class="stat"><b>${total - na}</b><span>ประเมินแล้ว</span></div>
      <div class="stat"><b>${na}</b><span>N/A</span></div>
    </div>
    <div class="sheet-actions"><button class="btn" data-action="closeModal">ยกเลิก</button>
      <button class="btn success" id="confirmBtn" data-action="confirmFinish">ยืนยันและบันทึก</button></div>`, "small");
}
function confirmFinish() {
  if (saving) return;
  const summary = equipmentSummary();
  saving = true;
  const btn = document.getElementById("confirmBtn");
  if (btn) { btn.disabled = true; btn.textContent = "กำลังบันทึก…"; }
  
  const teamName = adminMode === 'dual' ? (activeTeam === 'team1' ? ' (ทีม 1)' : ' (ทีม 2)') : '';
  const finalShift = shiftInfo.shift + teamName;

  google.script.run
    .withSuccessHandler(() => {
      try { localStorage.removeItem(draftKey()); } catch {}
      draft = { beds:{} }; state = freshState(); currentDept = ""; currentBed = ""; saving = false;
      render(); showSummary(summary);
    })
    .withFailureHandler(err => {
      saving = false; closeModal(); render();
      toast("บันทึกไม่สำเร็จ: " + (err.message || err));
    })
    .saveRound({ date: shiftInfo.date, shift: finalShift, nurseName: nurse });
}
function showSummary(sum) {
  const keys = [["F/C","fc"], ["C-line","cl"], ["ETT/TT","ett"]];
  openModal(`
    <div class="sum-top">
      <div class="sum-badge-icon">${ICON.shield}</div>
      <div>
        <h2>สรุปอุปกรณ์เครื่องมือแพทย์ประจำวัน</h2>
        <p class="sheet-sub">${WARD} · ${esc(shiftInfo.displayDate)} · เวร${esc(shiftInfo.shift)}</p>
      </div>
    </div>
    <div class="saved-banner">
      ${ICON.check} บันทึกข้อมูลการราวน์ลงในระบบเรียบร้อยแล้ว
    </div>
    <div class="eq-container">
      ${keys.map(([k, c]) => `
        <div class="eq-box ${c}">
          <div class="eq-header">
            <span class="eq-title">${k}</span>
            <span class="eq-num">${sum[k].length}<small>ราย</small></span>
          </div>
          ${sum[k].length
            ? `<div class="eq-list">${sum[k].map(b => `<span class="eq-tag">${esc(b)}</span>`).join("")}</div>`
            : `<div class="eq-none">ไม่มีรายงานอุปกรณ์นี้</div>`}
        </div>`).join("")}
    </div>
    <div class="sheet-actions">
      <button class="btn primary" data-action="closeModal">ปิดหน้าต่าง</button>
    </div>`);
}

document.addEventListener("click", e => {
  if (e.target.id === "modal") return closeModal();
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const { action, field, value, id } = t.dataset;
  switch (action) {
    case "openAdmin": openAdminModal(); break;
    case "switchTeam": {
      persist();
      activeTeam = t.dataset.team;
      try { localStorage.setItem("isitdown_active_team", activeTeam); } catch {}
      updateDepartmentsFilter();
      currentDept = ""; currentBed = "";
      loadDraft();
      render();
      break;
    }
    case "saveAdmin": {
      const sel = document.getElementById("adminModeSelect");
      if (sel) {
        adminMode = sel.value;
        if (adminMode === 'single') {
          singleTeamDepts = Array.from(document.querySelectorAll('input[name="single_dept"]:checked')).map(cb => cb.value);
          try { localStorage.setItem("isitdown_single_depts", JSON.stringify(singleTeamDepts)); } catch {}
        } else {
          team1Depts = Array.from(document.querySelectorAll('input[name="t1_dept"]:checked')).map(cb => cb.value);
          team2Depts = allDeptsList.filter(name => !team1Depts.includes(name));
          try {
            localStorage.setItem("isitdown_team1_depts", JSON.stringify(team1Depts));
            localStorage.setItem("isitdown_team2_depts", JSON.stringify(team2Depts));
          } catch {}
        }
        try { localStorage.setItem("isitdown_admin_mode", adminMode); } catch {}
        updateDepartmentsFilter();
        currentDept = ""; currentBed = "";
        loadDraft();
        closeModal();
        render();
        toast("บันทึกการตั้งค่าเรียบร้อย");
      }
      break;
    }
    case "dept": {
      persist();
      const d = departments.find(x => x.name === value);
      const first = d.beds.find(b => !isFinished(bedStatus(d.name, b))) || d.beds[0];
      loadBed(d.name, first); break;
    }
    case "bed": persist(); loadBed(currentDept, value); break;
    case "prev": moveBed(-1); break;
    case "next": moveBed(1); break;
    case "finish": requestFinish(); break;
    case "confirmFinish": confirmFinish(); break;
    case "closeModal": closeModal(); break;
    case "jump":
      closeModal(); persist(); loadBed(t.dataset.dept, t.dataset.bed);
      window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "single": toggleSingle(field, value); break;
    case "multi": toggleMulti(field, value); break;
    case "oxygen": setOxygen(value); break;
    case "reason": state.emptyReason = value; persist(); render(); break;
    case "icd": openIcd(); break;
    case "check": toggleCheck(id); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "nurse") {
    nurse = e.target.value;
    try { nurse ? localStorage.setItem("isitdown_selected_nurse", nurse) : localStorage.removeItem("isitdown_selected_nurse"); } catch {}
    render();
  } else if (e.target.id === "bedEmpty") setEmpty(e.target.checked);
});
document.addEventListener("input", e => {
  if (e.target.id === "notes") { state.notes = e.target.value; persist(); }
});

google.script.run
  .withSuccessHandler(data => {
    config = data; shiftInfo = data.shift; rawDepartments = data.departments;
    try {
      adminMode = localStorage.getItem("isitdown_admin_mode") || "single";
      activeTeam = localStorage.getItem("isitdown_active_team") || "team1";
      const single = localStorage.getItem("isitdown_single_depts");
      const t1 = localStorage.getItem("isitdown_team1_depts");
      const t2 = localStorage.getItem("isitdown_team2_depts");
      if (single) singleTeamDepts = JSON.parse(single);
      if (t1) team1Depts = JSON.parse(t1);
      if (t2) team2Depts = JSON.parse(t2);
    } catch {}
    updateDepartmentsFilter();
    loadDraft();
    try { nurse = localStorage.getItem("isitdown_selected_nurse") || ""; } catch {}
    if (nurse && !config.staff.includes(nurse)) nurse = "";
    const rd = departments.find(d => d.name === draft.dept);
    if (rd && rd.beds.includes(draft.bed)) loadBed(rd.name, draft.bed);
    else render();
  })
  .withFailureHandler(err => {
    document.getElementById("app").innerHTML =
      `<div class="state-card"><h3>โหลดข้อมูลไม่สำเร็จ</h3><p>${esc(err.message || err)}</p></div>`;
  })
  .getInitialData();
</script>
</body>
</html>
